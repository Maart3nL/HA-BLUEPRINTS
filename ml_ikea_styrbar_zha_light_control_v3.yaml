# Blueprint metadata
blueprint:
  name: "IKEA STYRBAR (ZHA) — Smooth Dimming & Adaptive Color"
  description: |
    # IKEA STYRBAR (ZHA) — Smooth Dimming & Adaptive Color

    Version 3.1

    ZHA-only IKEA E2001/E2002 STYRBAR controller with hardcoded light actions,
    shared-helper settings, smooth ramping and transitions.

    **V3.1 changes vs v3.0:**
    - **Mixed-light safe turn-on**: each light receives only the parameters it
      supports. Color temp is sent only to lights with a `color_temp` mode;
      brightness only to dimmable lights; on/off-only lights are just switched
      on. Mix Hue, IKEA and plain on/off bulbs in one group freely.
    - **Less duplication**: left/right color-temp and up/down brightness now
      share one code path each (direction is derived at run time), and the four
      release branches are merged into one. Behaviour is unchanged.
    - **No redundant Zigbee traffic during ramps**: a light is no longer
      re-commanded once it has reached its bound; the loop skips it.
    - **Brightness step & floor are now percentages** (1-100 %), matching the
      turn-on brightness setting. Update the two brightness helpers accordingly.
    - **Per-remote overrides**: the synced settings still default to the shared
      helpers, but you can now point an individual automation at different
      helper entities (e.g. a second STYRBAR with its own day/night temps).

    **V3.0 changes vs v2.0:**
    - Long-press brightness & color-temp ramps are **smooth**: each light's
      starting value is snapshotted once and stepped predictably.
    - Loops **stop early** once every light has reached its target bound.
    - A configurable **transition** smooths every light change.
    - Synced toggle: **apply turn-on settings only when the light was off**.

    ## Actions
    - **Left short / long**:  Color temp **down** (short step / long step)
    - **Right short / long**: Color temp **up** (short step / long step)
    - **Up short**:    Turn on the *up-short* lights
    - **Up double**:   Turn on the *up-double* lights
    - **Up long**:     Brightness up (smooth ramp; loops)
    - **Down short**:  Turn off the *down-short* lights
    - **Down double**: Turn off the *down-double* lights
    - **Down long**:   Brightness down (smooth ramp; loops; floors, never off)

    ## Which lights each action uses
    - **Up short / Up double / Down short / Down double**: their own selectors.
    - **Color temp (Left & Right)**: union of Up-short + Up-double lights,
      deduplicated. Not separately configurable.
    - **Up long (brighten)**: union of Up-short + Up-double lights.
    - **Down long (dim)**: union of Down-short + Down-double lights.

    ## Rules
    - Brightness/color-temp adjustments only affect lights that are **already
      on** (and support the feature). Off / unsupported lights are skipped.
    - Brightness floors at the configured floor (never turns a light off) and
      caps at 100 %.
    - Color temp is clamped to each light's supported min/max kelvin.
    - On turn-on, each light is set to a configurable brightness and a
      time-of-day color temperature - but only for the parameters it actually
      supports (subject to the "only when off" toggle).

    ## Synced settings via helpers
    Read **live** at run time from helper entities (see `styrbar_helpers.yaml`).
    Each setting defaults to a shared helper so, out of the box, every
    automation built from this blueprint shares the same values - change a
    helper once and they all update. To give one remote its own settings, point
    its overrides at different helpers. Missing/unavailable helper -> built-in
    fallback.

    | Setting | Default helper entity | Fallback |
    |---|---|---|
    | Daytime color temp | input_number.styrbar_day_color_temp | 3400 K |
    | Night-time color temp | input_number.styrbar_night_color_temp | 2200 K |
    | Daytime window start | input_datetime.styrbar_day_start | 06:00 |
    | Daytime window end | input_datetime.styrbar_day_end | 19:00 |
    | Color temp step - short | input_number.styrbar_color_temp_step_short | 500 K |
    | Color temp step - long | input_number.styrbar_color_temp_step_long | 400 K |
    | Brightness step (%) | input_number.styrbar_brightness_step | 8 % |
    | Brightness floor (%) | input_number.styrbar_brightness_floor | 2 % |
    | Adaptive only when off | input_boolean.styrbar_adaptive_only_when_off | off |

    **Create these helpers first** (see `styrbar_helpers.yaml`), otherwise the
    fallback values are always used.

    ## Optional helper - double press & release events
    Double-press (Up/Down) and `ahb_controller_event` release events need an
    `input_text` helper for state across restarts. Leave empty to disable those;
    everything else still works.

  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    controller_device:
      name: (Required) Controller Device
      description: The ZHA STYRBAR device to use for this automation.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: Remote Control N2
          multiple: false
    helper_last_controller_event:
      name: (Optional) Helper - Last Controller Event
      description: >-
        An `input_text` helper used to store the last event fired by the controller.
        **Leave empty to skip — double press and release events will be disabled.**
        If set, the helper must already exist (max length >= 100).
      default: ''
      selector:
        entity:
          domain: input_text

    # ---------- Light selectors ----------
    lights_up_short:
      name: Up short press - lights (Turn on)
      description: Turned on at the configured brightness and time-of-day color temp.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_double:
      name: Up double press - lights (Turn on)
      description: Turned on at the configured brightness and time-of-day color temp.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_short:
      name: Down short press - lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_double:
      name: Down double press - lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light

    # ---------- Per-automation settings ----------
    turn_on_brightness_pct:
      name: (Optional) Turn-on brightness
      description: Brightness level applied when lights are turned on (Up short / Up double).
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
          step: 1
    transition_seconds:
      name: (Optional) Transition time
      description: >-
        Fade time applied to brightness ramps, color-temp changes and turn-off.
        For long-press ramps a value at or just above the loop delay gives the
        smoothest result. Set to 0 for instant changes. (Turn-on uses its own
        setting below.)
      default: 0.3
      selector:
        number:
          min: 0
          max: 5
          unit_of_measurement: s
          mode: box
          step: 0.1
    transition_on_turn_on:
      name: (Optional) Turn-on transition time
      description: >-
        Fade time used only when turning lights ON (Up short / Up double).
        Default 0 (instant). Some Zigbee bulbs power on at a wrong/low
        brightness when a transition is applied from the off state — keep this
        at 0 if you see that, even while using a transition for ramps above.
      default: 0
      selector:
        number:
          min: 0
          max: 5
          unit_of_measurement: s
          mode: box
          step: 0.1
    long_press_max_repeats:
      name: (Optional) Long press - maximum iterations
      description: Safety cap on how many times a long-press action repeats while held.
      default: 15
      selector:
        number:
          min: 1
          max: 100
          mode: box
          step: 1
    long_press_loop_delay:
      name: (Optional) Long press loop delay
      description: Delay between iterations during a long press loop.
      default: 150
      selector:
        number:
          min: 50
          max: 2000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_double_press_delay:
      name: (Optional) Helper - Double Press delay
      description: Max delay between the first and second press for the double press to register.
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_debounce_delay:
      name: (Optional) Helper - Debounce delay
      description: Delay used for debouncing raw controller events. Increase if you see duplicate events.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: milliseconds
          mode: box
          step: 10

    # ---------- Synced settings (advanced: per-remote overrides) ----------
    # Each defaults to the shared helper. Leave as-is to share settings across
    # every STYRBAR automation; change one to give this remote its own values.
    setting_day_color_temp:
      name: (Synced) Daytime color temp helper
      description: input_number holding the daytime color temperature (K).
      default: input_number.styrbar_day_color_temp
      selector:
        entity:
          domain: input_number
    setting_night_color_temp:
      name: (Synced) Night-time color temp helper
      description: input_number holding the night-time color temperature (K).
      default: input_number.styrbar_night_color_temp
      selector:
        entity:
          domain: input_number
    setting_day_start:
      name: (Synced) Daytime window start helper
      description: input_datetime (time only) for when daytime begins.
      default: input_datetime.styrbar_day_start
      selector:
        entity:
          domain: input_datetime
    setting_day_end:
      name: (Synced) Daytime window end helper
      description: input_datetime (time only) for when daytime ends.
      default: input_datetime.styrbar_day_end
      selector:
        entity:
          domain: input_datetime
    setting_color_temp_step_short:
      name: (Synced) Color temp step - short press helper
      description: input_number holding the short-press color-temp step (K).
      default: input_number.styrbar_color_temp_step_short
      selector:
        entity:
          domain: input_number
    setting_color_temp_step_long:
      name: (Synced) Color temp step - long press helper
      description: input_number holding the long-press color-temp step (K).
      default: input_number.styrbar_color_temp_step_long
      selector:
        entity:
          domain: input_number
    setting_brightness_step:
      name: (Synced) Brightness step helper (%)
      description: input_number holding the brightness ramp step as a percentage.
      default: input_number.styrbar_brightness_step
      selector:
        entity:
          domain: input_number
    setting_brightness_floor:
      name: (Synced) Brightness floor helper (%)
      description: input_number holding the lowest dim level as a percentage (never off).
      default: input_number.styrbar_brightness_floor
      selector:
        entity:
          domain: input_number
    setting_adaptive_only_when_off:
      name: (Synced) Adaptive only when off helper
      description: input_boolean - apply turn-on settings only when the light was off.
      default: input_boolean.styrbar_adaptive_only_when_off
      selector:
        entity:
          domain: input_boolean

# ===================================================================
# Automation schema
# ===================================================================
variables:
  # ---- Static inputs ----
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  helper_debounce_delay: !input helper_debounce_delay
  long_press_loop_delay: !input long_press_loop_delay
  long_press_max_repeats: !input long_press_max_repeats
  turn_on_brightness_pct: !input turn_on_brightness_pct
  transition_seconds: !input transition_seconds
  transition_on_turn_on: !input transition_on_turn_on
  controller_id: !input controller_device

  # ---- Light selectors ----
  lights_up_short: !input lights_up_short
  lights_up_double: !input lights_up_double
  lights_down_short: !input lights_down_short
  lights_down_double: !input lights_down_double

  # ---- Synced setting helper entities (override-able; default to shared) ----
  e_day_color_temp: !input setting_day_color_temp
  e_night_color_temp: !input setting_night_color_temp
  e_day_start_time: !input setting_day_start
  e_day_end_time: !input setting_day_end
  e_color_temp_step_short: !input setting_color_temp_step_short
  e_color_temp_step_long: !input setting_color_temp_step_long
  e_brightness_step: !input setting_brightness_step
  e_brightness_floor: !input setting_brightness_floor
  e_adaptive_only_when_off: !input setting_adaptive_only_when_off

  # ---- Resolved setting values (live read with fallback) ----
  day_color_temp: "{{ (states(e_day_color_temp) | float(3400)) | int }}"
  night_color_temp: "{{ (states(e_night_color_temp) | float(2200)) | int }}"
  color_temp_step_short: "{{ (states(e_color_temp_step_short) | float(500)) | int }}"
  color_temp_step_long: "{{ (states(e_color_temp_step_long) | float(400)) | int }}"
  adaptive_only_when_off: "{{ is_state(e_adaptive_only_when_off, 'on') }}"
  day_start_time: "{{ states(e_day_start_time) if states(e_day_start_time) not in ['unknown', 'unavailable'] else '06:00' }}"
  day_end_time: "{{ states(e_day_end_time) if states(e_day_end_time) not in ['unknown', 'unavailable'] else '19:00' }}"
  # Brightness step/floor are configured in %; convert to the 0-255 scale once.
  brightness_step_pct: "{{ states(e_brightness_step) | float(8) }}"
  brightness_floor_pct: "{{ states(e_brightness_floor) | float(2) }}"
  brightness_step: "{{ [1, (brightness_step_pct / 100 * 255) | round(0) | int] | max }}"
  brightness_floor: "{{ [1, (brightness_floor_pct / 100 * 255) | round(0) | int] | max }}"

  # ---- Derived light lists (deduplicated) ----
  ct_lights: "{{ (lights_up_short + lights_up_double) | unique | list }}"
  up_long_lights: "{{ (lights_up_short + lights_up_double) | unique | list }}"
  down_long_lights: "{{ (lights_down_short + lights_down_double) | unique | list }}"

  # ---- Derived constants ----
  adjusted_double_press_delay: "{{ [helper_double_press_delay - helper_debounce_delay, 100] | max }}"
  helper_configured: "{{ (helper_last_controller_event | default('') | string | trim) != '' }}"
  adaptive_on_kelvin: >-
    {%- set cur = now().hour * 60 + now().minute -%}
    {%- set start = day_start_time.split(':')[0] | int * 60 + day_start_time.split(':')[1] | int -%}
    {%- set end = day_end_time.split(':')[0] | int * 60 + day_end_time.split(':')[1] | int -%}
    {%- set is_day = (start <= cur < end) if start <= end else (cur >= start or cur < end) -%}
    {{ day_color_temp if is_day else night_color_temp }}

  # ---- ZHA action code mappings ----
  button_left_short: ['press_257_13_0']
  button_left_long: ['hold_3329_0']
  button_left_release: ['release']
  button_right_short: ['press_256_13_0']
  button_right_long: ['hold_3328_0']
  button_right_release: ['release']
  button_up_short: ['on']
  button_up_long: ['move_with_on_off_0_83', 'move_with_on_off_MoveMode.Up_83']
  button_up_release: ['stop', 'stop_with_on_off']
  button_down_short: ['off']
  button_down_long: ['move_1_83', 'move_MoveMode.Down_83_0_0']
  button_down_release: ['stop', 'stop_with_on_off', 'stop_0_0']
  all_release_codes: "{{ button_left_release + button_right_release + button_up_release + button_down_release }}"
  all_long_codes: "{{ button_left_long + button_right_long + button_up_long + button_down_long }}"

  # ---- Runtime-computed values ----
  trigger_action: >-
    {{ trigger.event.data.command }}{{ "_" if trigger.event.data.args|length > 0 }}{{ trigger.event.data.args|join("_") }}
  needs_helper_write: >-
    {{ trigger_action in button_left_short
       or trigger_action in button_right_short
       or trigger_action in button_up_short
       or trigger_action in button_down_short
       or trigger_action in button_left_long
       or trigger_action in button_right_long
       or trigger_action in button_up_long
       or trigger_action in button_down_long }}

mode: restart
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input controller_device

conditions:
  - condition: template
    value_template: '{{ trigger_action not in ["", "None", "unknown"] }}'

actions:
  - delay:
      milliseconds: !input helper_debounce_delay

  - variables:
      deserialized_state: '{{ states(helper_last_controller_event) | from_json(default={}) if helper_configured else {} }}'
      trigger_delta: '{{ (as_timestamp(now()) - (deserialized_state.t | default(0))) * 1000 }}'
      last_controller_event: '{{ deserialized_state.a | default("") }}'

  - if: '{{ helper_configured and needs_helper_write }}'
    then:
      - action: input_text.set_value
        data:
          entity_id: '{{ helper_last_controller_event }}'
          value: '{{ {"a": trigger_action, "t": as_timestamp(now())} | to_json }}'

  - choose:
      # ============================================================
      # LEFT / RIGHT SHORT - Color Temp step (one-shot) on ct_lights
      #   direction: left = down (-1), right = up (+1)
      # ============================================================
      - conditions: '{{ trigger_action in button_left_short or trigger_action in button_right_short }}'
        sequence:
          - variables:
              ct_dir: "{{ -1 if trigger_action in button_left_short else 1 }}"
              ct_event_action: "{{ 'button_left_short' if trigger_action in button_left_short else 'button_right_short' }}"
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: '{{ ct_event_action }}'
          - repeat:
              for_each: '{{ ct_lights }}'
              sequence:
                - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'color_temp_kelvin') is not none }}"
                  then:
                    - variables:
                        current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int }}"
                        min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) }}"
                        max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) }}"
                        target_k: "{{ [ [ current_k + (color_temp_step_short | int) * ct_dir, min_k ] | max, max_k ] | min }}"
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ target_k }}"
                        transition: "{{ transition_seconds }}"

      # ============================================================
      # LEFT / RIGHT LONG - Color Temp smooth ramp w/ early-exit
      #   direction: left = down (-1), right = up (+1)
      # ============================================================
      - conditions: '{{ trigger_action in button_left_long or trigger_action in button_right_long }}'
        sequence:
          - variables:
              ct_dir: "{{ -1 if trigger_action in button_left_long else 1 }}"
              ct_event_action: "{{ 'button_left_long' if trigger_action in button_left_long else 'button_right_long' }}"
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: '{{ ct_event_action }}'
          - variables:
              ct_snap: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for e in ct_lights -%}
                {%- if states(e) == 'on' and state_attr(e, 'color_temp_kelvin') is not none -%}
                {%- set ns.l = ns.l + [{'e': e, 'start': state_attr(e, 'color_temp_kelvin') | int, 'min': state_attr(e, 'min_color_temp_kelvin') | int(2000), 'max': state_attr(e, 'max_color_temp_kelvin') | int(6500)}] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}
              ct_iters: >-
                {%- set ns = namespace(m=0) -%}
                {%- for x in ct_snap -%}
                {%- set d = (x.start - x.min) if ct_dir < 0 else (x.max - x.start) -%}
                {%- set ns.m = [ns.m, d] | max -%}
                {%- endfor -%}
                {{ [long_press_max_repeats, (ns.m / (color_temp_step_long | int)) | round(0, 'ceil') | int] | min if ct_snap | length > 0 else 0 }}
          - repeat:
              count: "{{ ct_iters }}"
              sequence:
                - variables:
                    iter_n: "{{ repeat.index }}"
                - repeat:
                    for_each: "{{ ct_snap }}"
                    sequence:
                      - variables:
                          cur_t: "{{ [ [ repeat.item.start + (color_temp_step_long | int) * ct_dir * (iter_n | int), repeat.item.min ] | max, repeat.item.max ] | min }}"
                          prev_t: "{{ [ [ repeat.item.start + (color_temp_step_long | int) * ct_dir * ((iter_n | int) - 1), repeat.item.min ] | max, repeat.item.max ] | min }}"
                      - if: "{{ states(repeat.item.e) == 'on' and cur_t != prev_t }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item.e }}"
                            data:
                              color_temp_kelvin: "{{ cur_t }}"
                              transition: "{{ transition_seconds }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # UP / DOWN LONG - Brightness smooth ramp w/ early-exit
      #   up   = brighten (+1), cap 255
      #   down = dim (-1), floor at brightness_floor (never off)
      # ============================================================
      - conditions: '{{ trigger_action in button_up_long or trigger_action in button_down_long }}'
        sequence:
          - variables:
              b_dir: "{{ 1 if trigger_action in button_up_long else -1 }}"
              b_event_action: "{{ 'button_up_long' if trigger_action in button_up_long else 'button_down_long' }}"
              b_lights: "{{ up_long_lights if trigger_action in button_up_long else down_long_lights }}"
              b_lo: "{{ 1 if trigger_action in button_up_long else (brightness_floor | int) }}"
              b_hi: 255
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: '{{ b_event_action }}'
          - variables:
              b_snap: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for e in b_lights -%}
                {%- if states(e) == 'on' and state_attr(e, 'brightness') is not none -%}
                {%- set ns.l = ns.l + [{'e': e, 'start': state_attr(e, 'brightness') | int}] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}
              b_iters: >-
                {%- set ns = namespace(m=0) -%}
                {%- for x in b_snap -%}
                {%- set d = (b_hi - x.start) if b_dir > 0 else (x.start - (b_lo | int)) -%}
                {%- set ns.m = [ns.m, d] | max -%}
                {%- endfor -%}
                {{ [long_press_max_repeats, (ns.m / (brightness_step | int)) | round(0, 'ceil') | int] | min if b_snap | length > 0 else 0 }}
          - repeat:
              count: "{{ b_iters }}"
              sequence:
                - variables:
                    iter_n: "{{ repeat.index }}"
                - repeat:
                    for_each: "{{ b_snap }}"
                    sequence:
                      - variables:
                          cur_b: "{{ [ [ repeat.item.start + (brightness_step | int) * b_dir * (iter_n | int), b_lo | int ] | max, b_hi | int ] | min }}"
                          prev_b: "{{ [ [ repeat.item.start + (brightness_step | int) * b_dir * ((iter_n | int) - 1), b_lo | int ] | max, b_hi | int ] | min }}"
                      - if: "{{ states(repeat.item.e) == 'on' and cur_b != prev_b }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item.e }}"
                            data:
                              brightness: "{{ cur_b }}"
                              transition: "{{ transition_seconds }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # UP SHORT (with double-press detection) - Turn ON
      #   Each light gets only the params it supports (mixed-light safe).
      # ============================================================
      - conditions: '{{ trigger_action in button_up_short }}'
        sequence:
          - choose:
              - conditions: '{{ helper_configured and trigger_action == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: '{{ helper_last_controller_event }}'
                      value: '{{ {"a": "double_press_up", "t": as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_up_double
                  - repeat:
                      for_each: "{{ lights_up_double }}"
                      sequence:
                        - if: "{{ not adaptive_only_when_off or states(repeat.item) != 'on' }}"
                          then:
                            - variables:
                                li_modes: "{{ state_attr(repeat.item, 'supported_color_modes') | default([], true) | list }}"
                                li_ct: "{{ 'color_temp' in li_modes }}"
                                li_bri: "{{ (li_modes | reject('eq', 'onoff') | list | length) > 0 }}"
                            - choose:
                                - conditions: "{{ li_ct }}"
                                  sequence:
                                    - action: light.turn_on
                                      target:
                                        entity_id: "{{ repeat.item }}"
                                      data:
                                        color_temp_kelvin: "{{ adaptive_on_kelvin }}"
                                        brightness_pct: "{{ turn_on_brightness_pct | int }}"
                                        transition: "{{ transition_on_turn_on }}"
                                - conditions: "{{ li_bri }}"
                                  sequence:
                                    - action: light.turn_on
                                      target:
                                        entity_id: "{{ repeat.item }}"
                                      data:
                                        brightness_pct: "{{ turn_on_brightness_pct | int }}"
                                        transition: "{{ transition_on_turn_on }}"
                              default:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
            default:
              - if: '{{ helper_configured }}'
                then:
                  - delay:
                      milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_up_short
              - repeat:
                  for_each: "{{ lights_up_short }}"
                  sequence:
                    - if: "{{ not adaptive_only_when_off or states(repeat.item) != 'on' }}"
                      then:
                        - variables:
                            li_modes: "{{ state_attr(repeat.item, 'supported_color_modes') | default([], true) | list }}"
                            li_ct: "{{ 'color_temp' in li_modes }}"
                            li_bri: "{{ (li_modes | reject('eq', 'onoff') | list | length) > 0 }}"
                        - choose:
                            - conditions: "{{ li_ct }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    color_temp_kelvin: "{{ adaptive_on_kelvin }}"
                                    brightness_pct: "{{ turn_on_brightness_pct | int }}"
                                    transition: "{{ transition_on_turn_on }}"
                            - conditions: "{{ li_bri }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ turn_on_brightness_pct | int }}"
                                    transition: "{{ transition_on_turn_on }}"
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: "{{ repeat.item }}"

      # ============================================================
      # DOWN SHORT (with double-press detection) - Turn OFF
      # ============================================================
      - conditions: '{{ trigger_action in button_down_short }}'
        sequence:
          - choose:
              - conditions: '{{ helper_configured and trigger_action == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: '{{ helper_last_controller_event }}'
                      value: '{{ {"a": "double_press_down", "t": as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_down_double
                  - if: '{{ lights_down_double | count > 0 }}'
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lights_down_double }}"
                        data:
                          transition: "{{ transition_seconds }}"
            default:
              - if: '{{ helper_configured }}'
                then:
                  - delay:
                      milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_down_short
              - if: '{{ lights_down_short | count > 0 }}'
                then:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ lights_down_short }}"
                    data:
                      transition: "{{ transition_seconds }}"

      # ============================================================
      # RELEASE (Left / Right / Up / Down) - Hooks event
      #   Needs the helper to know which long-press was active so it can
      #   fire the matching release event. One merged branch for all four.
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action.split("_")[0] in all_release_codes }}'
          - '{{ last_controller_event in all_long_codes }}'
        sequence:
          - variables:
              rel_action: >-
                {{ 'button_left_release' if last_controller_event in button_left_long
                   else 'button_right_release' if last_controller_event in button_right_long
                   else 'button_up_release' if last_controller_event in button_up_long
                   else 'button_down_release' }}
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: '{{ rel_action }}'
