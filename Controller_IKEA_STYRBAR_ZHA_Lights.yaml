# Blueprint metadata
blueprint:
  name: ML Ikea Styrbar zha light control v3.0
  description: |
    # ML Ikea Styrbar zha light control v3.0

    ZHA-only IKEA E2001/E2002 STYRBAR controller with hardcoded light actions,
    shared-helper settings, smooth ramping and transitions.

    **V3 changes vs v2.0:**
    - Long-press brightness & color-temp ramps are now **smooth**: the starting
      value of each light is snapshotted once and stepped predictably, so the
      ramp no longer stutters when Zigbee state lags.
    - Loops **stop early** once every light has reached its target bound
      (255 / floor / min-max kelvin) instead of running redundant iterations.
    - A configurable **transition** smooths every light change.
    - New synced toggle: **apply turn-on settings only when the light was off**
      (preserve a manually-set level/temp when a light is already on).

    ## Actions
    - **Left short / long**:  Color temp **down** (short step / long step)
    - **Right short / long**: Color temp **up** (short step / long step)
    - **Up short**:    Turn on the *up-short* lights
    - **Up double**:   Turn on the *up-double* lights
    - **Up long**:     Brightness up (smooth ramp; loops)
    - **Down short**:  Turn off the *down-short* lights
    - **Down double**: Turn off the *down-double* lights
    - **Down long**:   Brightness down (smooth ramp; loops; floors, never off)

    ## Which lights each action uses
    - **Up short / Up double / Down short / Down double**: their own selectors.
    - **Color temp (Left & Right)**: union of Up-short + Up-double lights,
      deduplicated. Not separately configurable.
    - **Up long (brighten)**: union of Up-short + Up-double lights.
    - **Down long (dim)**: union of Down-short + Down-double lights.

    ## Rules
    - Brightness/color-temp adjustments only affect lights that are **already
      on** (and support the feature). Off / unsupported lights are skipped.
    - Brightness floors at the configured floor (never turns a light off) and
      caps at 255.
    - Color temp is clamped to each light's supported min/max kelvin.
    - On turn-on, lights are set to a configurable brightness and a
      time-of-day color temperature (subject to the "only when off" toggle).

    ## Synced settings via fixed helpers
    Read **live** at run time from fixed helper entities (see
    `styrbar_helpers.yaml`). Not selectable here - every automation built from
    this blueprint shares them. Missing/unavailable helper -> built-in fallback.

    | Setting | Helper entity | Fallback |
    |---|---|---|
    | Daytime color temp | input_number.styrbar_day_color_temp | 3400 K |
    | Night-time color temp | input_number.styrbar_night_color_temp | 2200 K |
    | Daytime window start | input_datetime.styrbar_day_start | 06:00 |
    | Daytime window end | input_datetime.styrbar_day_end | 19:00 |
    | Color temp step - short | input_number.styrbar_color_temp_step_short | 500 K |
    | Color temp step - long | input_number.styrbar_color_temp_step_long | 400 K |
    | Brightness step | input_number.styrbar_brightness_step | 20 |
    | Brightness floor | input_number.styrbar_brightness_floor | 5 |
    | Adaptive only when off | input_boolean.styrbar_adaptive_only_when_off | off |

    **Create these helpers first** (see `styrbar_helpers.yaml`), otherwise the
    fallback values are always used.

    ## Optional helper - double press & release events
    Double-press (Up/Down) and `ahb_controller_event` release events need an
    `input_text` helper for state across restarts. Leave empty to disable those;
    everything else still works.

  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    controller_device:
      name: (Required) Controller Device
      description: The ZHA STYRBAR device to use for this automation.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: Remote Control N2
          multiple: false
    helper_last_controller_event:
      name: (Optional) Helper - Last Controller Event
      description: >-
        An `input_text` helper used to store the last event fired by the controller.
        **Leave empty to skip — double press and release events will be disabled.**
        If set, the helper must already exist (max length >= 100).
      default: ''
      selector:
        entity:
          domain: input_text

    # ---------- Light selectors ----------
    lights_up_short:
      name: Up short press - lights (Turn on)
      description: Turned on at the configured brightness and time-of-day color temp.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_double:
      name: Up double press - lights (Turn on)
      description: Turned on at the configured brightness and time-of-day color temp.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_short:
      name: Down short press - lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_double:
      name: Down double press - lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light

    # ---------- Per-automation settings ----------
    turn_on_brightness_pct:
      name: (Optional) Turn-on brightness
      description: Brightness level applied when lights are turned on (Up short / Up double).
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
          step: 1
    transition_seconds:
      name: (Optional) Transition time
      description: >-
        Fade time applied to brightness ramps, color-temp changes and turn-off.
        For long-press ramps a value at or just above the loop delay gives the
        smoothest result. Set to 0 for instant changes. (Turn-on uses its own
        setting below.)
      default: 0.3
      selector:
        number:
          min: 0
          max: 5
          unit_of_measurement: s
          mode: box
          step: 0.1
    transition_on_turn_on:
      name: (Optional) Turn-on transition time
      description: >-
        Fade time used only when turning lights ON (Up short / Up double).
        Default 0 (instant). Some Zigbee bulbs power on at a wrong/low
        brightness when a transition is applied from the off state — keep this
        at 0 if you see that, even while using a transition for ramps above.
      default: 0
      selector:
        number:
          min: 0
          max: 5
          unit_of_measurement: s
          mode: box
          step: 0.1
    long_press_max_repeats:
      name: (Optional) Long press - maximum iterations
      description: Safety cap on how many times a long-press action repeats while held.
      default: 15
      selector:
        number:
          min: 1
          max: 100
          mode: box
          step: 1
    long_press_loop_delay:
      name: (Optional) Long press loop delay
      description: Delay between iterations during a long press loop.
      default: 150
      selector:
        number:
          min: 50
          max: 2000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_double_press_delay:
      name: (Optional) Helper - Double Press delay
      description: Max delay between the first and second press for the double press to register.
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_debounce_delay:
      name: (Optional) Helper - Debounce delay
      description: Delay used for debouncing raw controller events. Increase if you see duplicate events.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: milliseconds
          mode: box
          step: 10

# ===================================================================
# Automation schema
# ===================================================================
variables:
  # ---- Static inputs ----
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  helper_debounce_delay: !input helper_debounce_delay
  long_press_loop_delay: !input long_press_loop_delay
  long_press_max_repeats: !input long_press_max_repeats
  turn_on_brightness_pct: !input turn_on_brightness_pct
  transition_seconds: !input transition_seconds
  transition_on_turn_on: !input transition_on_turn_on
  controller_id: !input controller_device

  # ---- Light selectors ----
  lights_up_short: !input lights_up_short
  lights_up_double: !input lights_up_double
  lights_down_short: !input lights_down_short
  lights_down_double: !input lights_down_double

  # ---- Synced setting helper entities (hardcoded - see styrbar_helpers.yaml) ----
  e_day_color_temp: input_number.styrbar_day_color_temp
  e_night_color_temp: input_number.styrbar_night_color_temp
  e_day_start_time: input_datetime.styrbar_day_start
  e_day_end_time: input_datetime.styrbar_day_end
  e_color_temp_step_short: input_number.styrbar_color_temp_step_short
  e_color_temp_step_long: input_number.styrbar_color_temp_step_long
  e_brightness_step: input_number.styrbar_brightness_step
  e_brightness_floor: input_number.styrbar_brightness_floor
  e_adaptive_only_when_off: input_boolean.styrbar_adaptive_only_when_off

  # ---- Resolved setting values (live read with fallback) ----
  day_color_temp: "{{ (states(e_day_color_temp) | float(3400)) | int }}"
  night_color_temp: "{{ (states(e_night_color_temp) | float(2200)) | int }}"
  color_temp_step_short: "{{ (states(e_color_temp_step_short) | float(500)) | int }}"
  color_temp_step_long: "{{ (states(e_color_temp_step_long) | float(400)) | int }}"
  brightness_step: "{{ (states(e_brightness_step) | float(20)) | int }}"
  brightness_floor: "{{ (states(e_brightness_floor) | float(5)) | int }}"
  adaptive_only_when_off: "{{ is_state(e_adaptive_only_when_off, 'on') }}"
  day_start_time: "{{ states(e_day_start_time) if states(e_day_start_time) not in ['unknown', 'unavailable'] else '06:00' }}"
  day_end_time: "{{ states(e_day_end_time) if states(e_day_end_time) not in ['unknown', 'unavailable'] else '19:00' }}"

  # ---- Derived light lists (deduplicated) ----
  ct_lights: "{{ (lights_up_short + lights_up_double) | unique | list }}"
  up_long_lights: "{{ (lights_up_short + lights_up_double) | unique | list }}"
  down_long_lights: "{{ (lights_down_short + lights_down_double) | unique | list }}"

  # ---- Derived constants ----
  adjusted_double_press_delay: "{{ [helper_double_press_delay - helper_debounce_delay, 100] | max }}"
  helper_configured: "{{ (helper_last_controller_event | default('') | string | trim) != '' }}"
  adaptive_on_kelvin: >-
    {%- set cur = now().hour * 60 + now().minute -%}
    {%- set start = day_start_time.split(':')[0] | int * 60 + day_start_time.split(':')[1] | int -%}
    {%- set end = day_end_time.split(':')[0] | int * 60 + day_end_time.split(':')[1] | int -%}
    {%- set is_day = (start <= cur < end) if start <= end else (cur >= start or cur < end) -%}
    {{ day_color_temp if is_day else night_color_temp }}

  # ---- ZHA action code mappings ----
  button_left_short: ['press_257_13_0']
  button_left_long: ['hold_3329_0']
  button_left_release: ['release']
  button_right_short: ['press_256_13_0']
  button_right_long: ['hold_3328_0']
  button_right_release: ['release']
  button_up_short: ['on']
  button_up_long: ['move_with_on_off_0_83', 'move_with_on_off_MoveMode.Up_83']
  button_up_release: ['stop', 'stop_with_on_off']
  button_down_short: ['off']
  button_down_long: ['move_1_83', 'move_MoveMode.Down_83_0_0']
  button_down_release: ['stop', 'stop_with_on_off', 'stop_0_0']

  # ---- Runtime-computed values ----
  trigger_action: >-
    {{ trigger.event.data.command }}{{ "_" if trigger.event.data.args|length > 0 }}{{ trigger.event.data.args|join("_") }}
  needs_helper_write: >-
    {{ trigger_action in button_left_short
       or trigger_action in button_right_short
       or trigger_action in button_up_short
       or trigger_action in button_down_short
       or trigger_action in button_left_long
       or trigger_action in button_right_long
       or trigger_action in button_up_long
       or trigger_action in button_down_long }}

mode: restart
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input controller_device

conditions:
  - condition: template
    value_template: '{{ trigger_action not in ["", "None", "unknown"] }}'

actions:
  - delay:
      milliseconds: !input helper_debounce_delay

  - variables:
      deserialized_state: '{{ states(helper_last_controller_event) | from_json(default={}) if helper_configured else {} }}'
      trigger_delta: '{{ (as_timestamp(now()) - (deserialized_state.t | default(0))) * 1000 }}'
      last_controller_event: '{{ deserialized_state.a | default("") }}'

  - if: '{{ helper_configured and needs_helper_write }}'
    then:
      - action: input_text.set_value
        data:
          entity_id: '{{ helper_last_controller_event }}'
          value: '{{ {"a": trigger_action, "t": as_timestamp(now())} | to_json }}'

  - choose:
      # ============================================================
      # LEFT SHORT - Color Temp decrease (one-shot) on ct_lights
      # ============================================================
      - conditions: '{{ trigger_action in button_left_short }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_short
          - repeat:
              for_each: '{{ ct_lights }}'
              sequence:
                - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'color_temp_kelvin') is not none }}"
                  then:
                    - variables:
                        current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int }}"
                        min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) }}"
                        max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) }}"
                        target_k: "{{ [ [ current_k - (color_temp_step_short | int), min_k ] | max, max_k ] | min }}"
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ target_k }}"
                        transition: "{{ transition_seconds }}"

      # ============================================================
      # LEFT LONG - Color Temp decrease, smooth ramp w/ early-exit
      # ============================================================
      - conditions: '{{ trigger_action in button_left_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_long
          - variables:
              ct_snap: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for e in ct_lights -%}
                {%- if states(e) == 'on' and state_attr(e, 'color_temp_kelvin') is not none -%}
                {%- set ns.l = ns.l + [{'e': e, 'start': state_attr(e, 'color_temp_kelvin') | int, 'min': state_attr(e, 'min_color_temp_kelvin') | int(2000), 'max': state_attr(e, 'max_color_temp_kelvin') | int(6500)}] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}
              ct_iters: >-
                {%- set ns = namespace(m=0) -%}
                {%- for x in ct_snap -%}{%- set ns.m = [ns.m, x.start - x.min] | max -%}{%- endfor -%}
                {{ [long_press_max_repeats, (ns.m / (color_temp_step_long | int)) | round(0, 'ceil') | int] | min if ct_snap | length > 0 else 0 }}
          - repeat:
              count: "{{ ct_iters }}"
              sequence:
                - variables:
                    iter_n: "{{ repeat.index }}"
                - repeat:
                    for_each: "{{ ct_snap }}"
                    sequence:
                      - if: "{{ states(repeat.item.e) == 'on' }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item.e }}"
                            data:
                              color_temp_kelvin: "{{ [ [ repeat.item.start - (color_temp_step_long | int) * (iter_n | int), repeat.item.min ] | max, repeat.item.max ] | min }}"
                              transition: "{{ transition_seconds }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # LEFT RELEASE - Hooks event (needs helper to disambiguate from right)
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action.split("_")[0] in button_left_release }}'
          - '{{ last_controller_event in button_left_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_release

      # ============================================================
      # RIGHT SHORT - Color Temp increase (one-shot) on ct_lights
      # ============================================================
      - conditions: '{{ trigger_action in button_right_short }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_short
          - repeat:
              for_each: '{{ ct_lights }}'
              sequence:
                - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'color_temp_kelvin') is not none }}"
                  then:
                    - variables:
                        current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int }}"
                        min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) }}"
                        max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) }}"
                        target_k: "{{ [ [ current_k + (color_temp_step_short | int), min_k ] | max, max_k ] | min }}"
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ target_k }}"
                        transition: "{{ transition_seconds }}"

      # ============================================================
      # RIGHT LONG - Color Temp increase, smooth ramp w/ early-exit
      # ============================================================
      - conditions: '{{ trigger_action in button_right_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_long
          - variables:
              ct_snap: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for e in ct_lights -%}
                {%- if states(e) == 'on' and state_attr(e, 'color_temp_kelvin') is not none -%}
                {%- set ns.l = ns.l + [{'e': e, 'start': state_attr(e, 'color_temp_kelvin') | int, 'min': state_attr(e, 'min_color_temp_kelvin') | int(2000), 'max': state_attr(e, 'max_color_temp_kelvin') | int(6500)}] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}
              ct_iters: >-
                {%- set ns = namespace(m=0) -%}
                {%- for x in ct_snap -%}{%- set ns.m = [ns.m, x.max - x.start] | max -%}{%- endfor -%}
                {{ [long_press_max_repeats, (ns.m / (color_temp_step_long | int)) | round(0, 'ceil') | int] | min if ct_snap | length > 0 else 0 }}
          - repeat:
              count: "{{ ct_iters }}"
              sequence:
                - variables:
                    iter_n: "{{ repeat.index }}"
                - repeat:
                    for_each: "{{ ct_snap }}"
                    sequence:
                      - if: "{{ states(repeat.item.e) == 'on' }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item.e }}"
                            data:
                              color_temp_kelvin: "{{ [ [ repeat.item.start + (color_temp_step_long | int) * (iter_n | int), repeat.item.min ] | max, repeat.item.max ] | min }}"
                              transition: "{{ transition_seconds }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # RIGHT RELEASE - Hooks event (needs helper to disambiguate from left)
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action.split("_")[0] in button_right_release }}'
          - '{{ last_controller_event in button_right_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_release

      # ============================================================
      # UP SHORT (with double-press detection) - Turn ON up-short lights
      # ============================================================
      - conditions: '{{ trigger_action in button_up_short }}'
        sequence:
          - choose:
              - conditions: '{{ helper_configured and trigger_action == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: '{{ helper_last_controller_event }}'
                      value: '{{ {"a": "double_press_up", "t": as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_up_double
                  - repeat:
                      for_each: "{{ lights_up_double }}"
                      sequence:
                        - if: "{{ not adaptive_only_when_off or states(repeat.item) != 'on' }}"
                          then:
                            - action: light.turn_on
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                color_temp_kelvin: "{{ adaptive_on_kelvin }}"
                                brightness_pct: "{{ turn_on_brightness_pct | int }}"
                                transition: "{{ transition_on_turn_on }}"
            default:
              - if: '{{ helper_configured }}'
                then:
                  - delay:
                      milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_up_short
              - repeat:
                  for_each: "{{ lights_up_short }}"
                  sequence:
                    - if: "{{ not adaptive_only_when_off or states(repeat.item) != 'on' }}"
                      then:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            color_temp_kelvin: "{{ adaptive_on_kelvin }}"
                            brightness_pct: "{{ turn_on_brightness_pct | int }}"
                            transition: "{{ transition_on_turn_on }}"

      # ============================================================
      # UP LONG - Brightness increase, smooth ramp w/ early-exit
      # ============================================================
      - conditions: '{{ trigger_action in button_up_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_up_long
          - variables:
              b_snap: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for e in up_long_lights -%}
                {%- if states(e) == 'on' and state_attr(e, 'brightness') is not none -%}
                {%- set ns.l = ns.l + [{'e': e, 'start': state_attr(e, 'brightness') | int}] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}
              b_iters: >-
                {%- set ns = namespace(m=0) -%}
                {%- for x in b_snap -%}{%- set ns.m = [ns.m, 255 - x.start] | max -%}{%- endfor -%}
                {{ [long_press_max_repeats, (ns.m / (brightness_step | int)) | round(0, 'ceil') | int] | min if b_snap | length > 0 else 0 }}
          - repeat:
              count: "{{ b_iters }}"
              sequence:
                - variables:
                    iter_n: "{{ repeat.index }}"
                - repeat:
                    for_each: "{{ b_snap }}"
                    sequence:
                      - if: "{{ states(repeat.item.e) == 'on' }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item.e }}"
                            data:
                              brightness: "{{ [ repeat.item.start + (brightness_step | int) * (iter_n | int), 255 ] | min }}"
                              transition: "{{ transition_seconds }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # UP RELEASE - Hooks event (needs helper to disambiguate from down)
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action in button_up_release }}'
          - '{{ last_controller_event in button_up_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_up_release

      # ============================================================
      # DOWN SHORT (with double-press detection) - Turn OFF down-short lights
      # ============================================================
      - conditions: '{{ trigger_action in button_down_short }}'
        sequence:
          - choose:
              - conditions: '{{ helper_configured and trigger_action == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: '{{ helper_last_controller_event }}'
                      value: '{{ {"a": "double_press_down", "t": as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_down_double
                  - if: '{{ lights_down_double | count > 0 }}'
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lights_down_double }}"
                        data:
                          transition: "{{ transition_seconds }}"
            default:
              - if: '{{ helper_configured }}'
                then:
                  - delay:
                      milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_down_short
              - if: '{{ lights_down_short | count > 0 }}'
                then:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ lights_down_short }}"
                    data:
                      transition: "{{ transition_seconds }}"

      # ============================================================
      # DOWN LONG - Brightness decrease, smooth ramp w/ early-exit
      # Floors at configured brightness floor; never turns lights off.
      # ============================================================
      - conditions: '{{ trigger_action in button_down_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_down_long
          - variables:
              b_snap: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for e in down_long_lights -%}
                {%- if states(e) == 'on' and state_attr(e, 'brightness') is not none -%}
                {%- set ns.l = ns.l + [{'e': e, 'start': state_attr(e, 'brightness') | int}] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}
              b_iters: >-
                {%- set ns = namespace(m=0) -%}
                {%- for x in b_snap -%}{%- set ns.m = [ns.m, x.start - (brightness_floor | int)] | max -%}{%- endfor -%}
                {{ [long_press_max_repeats, (ns.m / (brightness_step | int)) | round(0, 'ceil') | int] | min if b_snap | length > 0 else 0 }}
          - repeat:
              count: "{{ b_iters }}"
              sequence:
                - variables:
                    iter_n: "{{ repeat.index }}"
                - repeat:
                    for_each: "{{ b_snap }}"
                    sequence:
                      - if: "{{ states(repeat.item.e) == 'on' }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item.e }}"
                            data:
                              brightness: "{{ [ repeat.item.start - (brightness_step | int) * (iter_n | int), brightness_floor | int ] | max }}"
                              transition: "{{ transition_seconds }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # DOWN RELEASE - Hooks event (needs helper to disambiguate from up)
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action in button_down_release }}'
          - '{{ last_controller_event in button_down_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_down_release
