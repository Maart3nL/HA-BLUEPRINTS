# Blueprint metadata
blueprint:
  name: Controller - IKEA E2001/E2002 STYRBAR Remote (ZHA, Light Control)
  description: |
    # Controller - IKEA E2001/E2002 STYRBAR Remote (ZHA, Light Control)

    Simplified **ZHA-only** automation for the IKEA E2001/E2002 STYRBAR remote
    with hardcoded light control actions per button. Each button has its own
    light selector, so you can target different lights per button.

    ## Hardcoded actions
    - **Left short**:  Color temperature **-500 K**
    - **Left long**:   Color temperature **-300 K** per iteration (loops, max 15)
    - **Right short**: Color temperature **+500 K**
    - **Right long**:  Color temperature **+300 K** per iteration (loops, max 15)
    - **Up short** / **Up double**:     Turn **on** selected lights
    - **Up long**:     Brightness **+20** per iteration (loops, max 15)
    - **Down short** / **Down double**: Turn **off** selected lights
    - **Down long**:   Brightness **-20** per iteration (loops, max 15)

    ## Rules
    - Brightness changes only affect lights that are **already on**.
      Lights that are off are skipped (no turn-on side effect).
    - Color temperature changes only affect lights that are **already on**.
      Brightness and on/off state are not modified.
    - **Up** and **Down** double-press events are always exposed.
    - Long press loops are capped at **15 iterations** and stop on release.

    ## Required helper
    Create an `input_text` helper (any name, e.g. `last_styrbar_event`) and
    select it below. Make sure its **maximum length** is at least **100**
    characters so the JSON state payload fits.

    Based on the Awesome HA Blueprints project by EPMatt.

  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    controller_device:
      name: (Required) Controller Device
      description: The ZHA STYRBAR device to use for this automation.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: Remote Control N2
          multiple: false
    helper_last_controller_event:
      name: (Required) Helper - Last Controller Event
      description: >-
        An `input_text` helper used to store the last event fired by the controller.
        Create it manually first. Minimum max length: 100 characters.
      selector:
        entity:
          domain: input_text

    # ---------- Light selectors per button ----------
    lights_left_short:
      name: Left short press — lights (CT -500 K)
      description: Only lights that are on will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_left_long:
      name: Left long press — lights (CT -300 K, looping)
      description: Only lights that are on will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_right_short:
      name: Right short press — lights (CT +500 K)
      description: Only lights that are on will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_right_long:
      name: Right long press — lights (CT +300 K, looping)
      description: Only lights that are on will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_short:
      name: Up short press — lights (Turn on)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_double:
      name: Up double press — lights (Turn on)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_long:
      name: Up long press — lights (Brightness +20, looping)
      description: Only lights that are on will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_short:
      name: Down short press — lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_double:
      name: Down double press — lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_long:
      name: Down long press — lights (Brightness -20, looping)
      description: Only lights that are on will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light

    # ---------- Timing helpers ----------
    long_press_loop_delay:
      name: (Optional) Long press loop delay
      description: Delay between iterations during a long press loop.
      default: 250
      selector:
        number:
          min: 50
          max: 2000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_double_press_delay:
      name: (Optional) Helper - Double Press delay
      description: Max delay between the first and second press for the double press to register.
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_debounce_delay:
      name: (Optional) Helper - Debounce delay
      description: Delay used for debouncing raw controller events. Increase if you see duplicate events.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: milliseconds
          mode: box
          step: 10

# ===================================================================
# Automation schema
# ===================================================================
variables:
  # Inputs -> variables (for templating)
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  helper_debounce_delay: !input helper_debounce_delay
  long_press_loop_delay: !input long_press_loop_delay
  adjusted_double_press_delay: '{{ [helper_double_press_delay - helper_debounce_delay, 100] | max }}'
  long_press_max_repeats: 15

  # ZHA action mappings (preserved from the original blueprint)
  button_left_short: ['press_257_13_0']
  button_left_long: ['hold_3329_0']
  button_left_release: ['release']
  button_right_short: ['press_256_13_0']
  button_right_long: ['hold_3328_0']
  button_right_release: ['release']
  button_up_short: ['on']
  button_up_long: ['move_with_on_off_0_83', 'move_with_on_off_MoveMode.Up_83']
  button_up_release: ['stop', 'stop_with_on_off']
  button_down_short: ['off']
  button_down_long: ['move_1_83', 'move_MoveMode.Down_83_0_0']
  button_down_release: ['stop', 'stop_with_on_off', 'stop_0_0']

  # Light selections per button action
  lights_left_short: !input lights_left_short
  lights_left_long: !input lights_left_long
  lights_right_short: !input lights_right_short
  lights_right_long: !input lights_right_long
  lights_up_short: !input lights_up_short
  lights_up_double: !input lights_up_double
  lights_up_long: !input lights_up_long
  lights_down_short: !input lights_down_short
  lights_down_double: !input lights_down_double
  lights_down_long: !input lights_down_long

  controller_id: !input controller_device

mode: restart
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input controller_device

conditions:
  - condition: template
    value_template: >-
      {%- set trigger_action -%}
      {{ trigger.event.data.command }}{{"_" if trigger.event.data.args|length > 0}}{{ trigger.event.data.args|join("_") }}
      {%- endset -%}
      {{ trigger_action not in ["","None","unknown"] }}

actions:
  # Debounce: previous runs wait, only the last run completes (mode: restart)
  - delay:
      milliseconds: !input helper_debounce_delay

  # Parse the trigger event and previous-event state
  - variables:
      trigger_action: >-
        {{ trigger.event.data.command }}{{"_" if trigger.event.data.args|length > 0}}{{ trigger.event.data.args|join("_") }}
      deserialized_state: '{{ (states(helper_last_controller_event) | from_json) if helper_last_controller_event is not none and (states(helper_last_controller_event) | regex_match("^\{\s*?((\"a\":\s*?\".*\"|\"t\":\s*?\d+\.\d+)(,\s*?)?){2}\s*?\}$")) else {} }}'
      trigger_delta: '{{ (as_timestamp(now()) - (deserialized_state.t | default(0))) * 1000 }}'
      last_controller_event: '{{ (deserialized_state.a | default("")) }}'

  # Persist the latest event for double-press detection and release routing
  - action: input_text.set_value
    data:
      entity_id: !input helper_last_controller_event
      value: '{{ {"a":trigger_action,"t":as_timestamp(now())} | to_json }}'

  - choose:
      # ============================================================
      # LEFT SHORT - Color Temp -500 K (one-shot)
      # ============================================================
      - conditions: '{{ trigger_action | string in button_left_short }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_short
          - repeat:
              for_each: '{{ lights_left_short }}'
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ states(repeat.item) == 'on' }}"
                  then:
                    - variables:
                        current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int(default=4000) }}"
                        min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                        max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                        target_k: "{{ [[current_k - 500, min_k] | max, max_k] | min }}"
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ target_k }}"

      # ============================================================
      # LEFT LONG - Color Temp -300 K per iteration (loops, max 15)
      # ============================================================
      - conditions: '{{ trigger_action | string in button_left_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_long
          - repeat:
              while: '{{ repeat.index <= long_press_max_repeats | int }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_left_long }}'
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(repeat.item) == 'on' }}"
                        then:
                          - variables:
                              current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int(default=4000) }}"
                              min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                              max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                              target_k: "{{ [[current_k - 300, min_k] | max, max_k] | min }}"
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              color_temp_kelvin: "{{ target_k }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # LEFT RELEASE - fire event for Hooks compatibility
      # ============================================================
      - conditions:
          - '{{ trigger_action.split("_")[0] in button_left_release }}'
          - '{{ last_controller_event | string in button_left_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_release

      # ============================================================
      # RIGHT SHORT - Color Temp +500 K (one-shot)
      # ============================================================
      - conditions: '{{ trigger_action | string in button_right_short }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_short
          - repeat:
              for_each: '{{ lights_right_short }}'
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ states(repeat.item) == 'on' }}"
                  then:
                    - variables:
                        current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int(default=4000) }}"
                        min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                        max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                        target_k: "{{ [[current_k + 500, min_k] | max, max_k] | min }}"
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ target_k }}"

      # ============================================================
      # RIGHT LONG - Color Temp +300 K per iteration (loops, max 15)
      # ============================================================
      - conditions: '{{ trigger_action | string in button_right_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_long
          - repeat:
              while: '{{ repeat.index <= long_press_max_repeats | int }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_right_long }}'
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(repeat.item) == 'on' }}"
                        then:
                          - variables:
                              current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int(default=4000) }}"
                              min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                              max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                              target_k: "{{ [[current_k + 300, min_k] | max, max_k] | min }}"
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              color_temp_kelvin: "{{ target_k }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # RIGHT RELEASE - fire event for Hooks compatibility
      # ============================================================
      - conditions:
          - '{{ trigger_action.split("_")[0] in button_right_release }}'
          - '{{ last_controller_event | string in button_right_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_release

      # ============================================================
      # UP SHORT (with double-press detection) - Turn ON
      # ============================================================
      - conditions: '{{ trigger_action | string in button_up_short }}'
        sequence:
          - choose:
              # Previous event was an up-short within the double-press window -> double press
              - conditions: '{{ trigger_action | string == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: !input helper_last_controller_event
                      value: '{{ {"a":"double_press_up","t":as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_up_double
                  - if:
                      - condition: template
                        value_template: "{{ lights_up_double | count > 0 }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ lights_up_double }}"
            # Otherwise: wait for a possible second press; if none arrives, run short press
            default:
              - delay:
                  milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_up_short
              - if:
                  - condition: template
                    value_template: "{{ lights_up_short | count > 0 }}"
                then:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ lights_up_short }}"

      # ============================================================
      # UP LONG - Brightness +20 per iteration (loops, max 15)
      # Only acts on lights that are already on.
      # ============================================================
      - conditions: '{{ trigger_action | string in button_up_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_up_long
          - repeat:
              while: '{{ repeat.index <= long_press_max_repeats | int }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_up_long }}'
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(repeat.item) == 'on' }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness_step: 20
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # UP RELEASE - fire event for Hooks compatibility
      # ============================================================
      - conditions:
          - '{{ trigger_action | string in button_up_release }}'
          - '{{ last_controller_event | string in button_up_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_up_release

      # ============================================================
      # DOWN SHORT (with double-press detection) - Turn OFF
      # ============================================================
      - conditions: '{{ trigger_action | string in button_down_short }}'
        sequence:
          - choose:
              - conditions: '{{ trigger_action | string == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: !input helper_last_controller_event
                      value: '{{ {"a":"double_press_down","t":as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_down_double
                  - if:
                      - condition: template
                        value_template: "{{ lights_down_double | count > 0 }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lights_down_double }}"
            default:
              - delay:
                  milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_down_short
              - if:
                  - condition: template
                    value_template: "{{ lights_down_short | count > 0 }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ lights_down_short }}"

      # ============================================================
      # DOWN LONG - Brightness -20 per iteration (loops, max 15)
      # Only acts on lights that are already on.
      # ============================================================
      - conditions: '{{ trigger_action | string in button_down_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_down_long
          - repeat:
              while: '{{ repeat.index <= long_press_max_repeats | int }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_down_long }}'
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(repeat.item) == 'on' }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness_step: -20
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # DOWN RELEASE - fire event for Hooks compatibility
      # ============================================================
      - conditions:
          - '{{ trigger_action | string in button_down_release }}'
          - '{{ last_controller_event | string in button_down_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_down_release
