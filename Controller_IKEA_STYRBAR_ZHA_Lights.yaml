    # ---------- Timing helpers ----------
    long_press_loop_delay:
      name: (Optional) Long press loop delay
      description: Delay between iterations during a long press loop.
      default: 150
      selector:
        number:
          min: 50
          max: 2000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_double_press_delay:
      name: (Optional) Helper - Double Press delay
      description: Max delay between the first and second press for the double press to register.
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_debounce_delay:
      name: (Optional) Helper - Debounce delay
      description: Delay used for debouncing raw controller events. Increase if you see duplicate events.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: milliseconds
          mode: box
          step: 10

# ===================================================================
# Automation schema
# ===================================================================
variables:
  # ---- Inputs -> variables (for templating) ----
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  helper_debounce_delay: !input helper_debounce_delay
  long_press_loop_delay: !input long_press_loop_delay
  brightness_step: !input brightness_step
  brightness_floor: !input brightness_floor
  color_temp_step_short: !input color_temp_step_short
  color_temp_step_long: !input color_temp_step_long
  long_press_max_repeats: !input long_press_max_repeats
  day_color_temp: !input day_color_temp
  night_color_temp: !input night_color_temp
  turn_on_brightness_pct: !input turn_on_brightness_pct
  day_start_time: !input day_start_time
  day_end_time: !input day_end_time
  controller_id: !input controller_device

  lights_left_short: !input lights_left_short
  lights_left_long: !input lights_left_long
  lights_right_short: !input lights_right_short
  lights_right_long: !input lights_right_long
  lights_up_short: !input lights_up_short
  lights_up_double: !input lights_up_double
  lights_up_long: !input lights_up_long
  lights_down_short: !input lights_down_short
  lights_down_double: !input lights_down_double
  lights_down_long: !input lights_down_long

  # ---- Derived constants ----
  adjusted_double_press_delay: '{{ [helper_double_press_delay - helper_debounce_delay, 100] | max }}'
  helper_configured: '{{ (helper_last_controller_event | default("") | string | trim) != "" }}'
  # Time-of-day color temperature applied when lights are turned on (Up short / Up double).
  # Daytime window uses day_color_temp; outside it uses night_color_temp.
  # Handles windows that wrap past midnight (e.g. start 20:00, end 06:00).
  adaptive_on_kelvin: >-
    {%- set cur = now().hour * 60 + now().minute -%}
    {%- set start = day_start_time.split(':')[0] | int * 60 + day_start_time.split(':')[1] | int -%}
    {%- set end = day_end_time.split(':')[0] | int * 60 + day_end_time.split(':')[1] | int -%}
    {%- set is_day = (start <= cur < end) if start <= end else (cur >= start or cur < end) -%}
    {{ (day_color_temp | int) if is_day else (night_color_temp | int) }}

  # ---- ZHA action code mappings (preserved from original blueprint) ----
  button_left_short: ['press_257_13_0']
  button_left_long: ['hold_3329_0']
  button_left_release: ['release']
  button_right_short: ['press_256_13_0']
  button_right_long: ['hold_3328_0']
  button_right_release: ['release']
  button_up_short: ['on']
  button_up_long: ['move_with_on_off_0_83', 'move_with_on_off_MoveMode.Up_83']
  button_up_release: ['stop', 'stop_with_on_off']
  button_down_short: ['off']
  button_down_long: ['move_1_83', 'move_MoveMode.Down_83_0_0']
  button_down_release: ['stop', 'stop_with_on_off', 'stop_0_0']

  # ---- Runtime-computed values (depend on trigger context) ----
  # Trigger action string, derived once from the ZHA event.
  trigger_action: >-
    {{ trigger.event.data.command }}{{ "_" if trigger.event.data.args|length > 0 }}{{ trigger.event.data.args|join("_") }}
  # Events that need the helper updated:
  #  - up/down short  -> for double-press detection
  #  - all short/long presses -> so the NEXT release event reads a fresh
  #    previous-event value and cannot misfire on a stale long-press code
  #    (left/right share the same 'release' code and are disambiguated this way).
  # Release events themselves are intentionally excluded (they must not
  # overwrite the long-press code they need to read).
  needs_helper_write: >-
    {{ trigger_action in button_left_short
       or trigger_action in button_right_short
       or trigger_action in button_up_short
       or trigger_action in button_down_short
       or trigger_action in button_left_long
       or trigger_action in button_right_long
       or trigger_action in button_up_long
       or trigger_action in button_down_long }}

mode: restart
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input controller_device

conditions:
  - condition: template
    value_template: '{{ trigger_action not in ["", "None", "unknown"] }}'

actions:
  # Debounce: previous runs wait, only the last run completes (mode: restart).
  - delay:
      milliseconds: !input helper_debounce_delay

  # Read previous-event state from the helper (if configured).
  - variables:
      deserialized_state: '{{ states(helper_last_controller_event) | from_json(default={}) if helper_configured else {} }}'
      trigger_delta: '{{ (as_timestamp(now()) - (deserialized_state.t | default(0))) * 1000 }}'
      last_controller_event: '{{ deserialized_state.a | default("") }}'

  # Persist the latest event so the next run can use it (only when needed).
  - if: '{{ helper_configured and needs_helper_write }}'
    then:
      - action: input_text.set_value
        data:
          entity_id: '{{ helper_last_controller_event }}'
          value: '{{ {"a": trigger_action, "t": as_timestamp(now())} | to_json }}'

  - choose:
      # ============================================================
      # LEFT SHORT - Color Temp decrease (one-shot)
      # ============================================================
      - conditions: '{{ trigger_action in button_left_short }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_short
          - repeat:
              for_each: '{{ lights_left_short }}'
              sequence:
                - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'color_temp_kelvin') is not none }}"
                  then:
                    - variables:
                        current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int }}"
                        min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                        max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                        target_k: "{{ [[current_k - (color_temp_step_short | int), min_k] | max, max_k] | min }}"
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ target_k }}"

      # ============================================================
      # LEFT LONG - Color Temp decrease per iteration (loops 15x)
      # ============================================================
      - conditions: '{{ trigger_action in button_left_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_long
          - repeat:
              count: '{{ long_press_max_repeats }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_left_long }}'
                    sequence:
                      - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'color_temp_kelvin') is not none }}"
                        then:
                          - variables:
                              current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int }}"
                              min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                              max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                              target_k: "{{ [[current_k - (color_temp_step_long | int), min_k] | max, max_k] | min }}"
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              color_temp_kelvin: "{{ target_k }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # LEFT RELEASE - fire event for Hooks compatibility
      # Requires helper to disambiguate from right release (same ZHA code).
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action.split("_")[0] in button_left_release }}'
          - '{{ last_controller_event in button_left_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_left_release

      # ============================================================
      # RIGHT SHORT - Color Temp increase (one-shot)
      # ============================================================
      - conditions: '{{ trigger_action in button_right_short }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_short
          - repeat:
              for_each: '{{ lights_right_short }}'
              sequence:
                - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'color_temp_kelvin') is not none }}"
                  then:
                    - variables:
                        current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int }}"
                        min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                        max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                        target_k: "{{ [[current_k + (color_temp_step_short | int), min_k] | max, max_k] | min }}"
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ target_k }}"

      # ============================================================
      # RIGHT LONG - Color Temp increase per iteration (loops 15x)
      # ============================================================
      - conditions: '{{ trigger_action in button_right_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_long
          - repeat:
              count: '{{ long_press_max_repeats }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_right_long }}'
                    sequence:
                      - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'color_temp_kelvin') is not none }}"
                        then:
                          - variables:
                              current_k: "{{ state_attr(repeat.item, 'color_temp_kelvin') | int }}"
                              min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(default=2000) }}"
                              max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(default=6500) }}"
                              target_k: "{{ [[current_k + (color_temp_step_long | int), min_k] | max, max_k] | min }}"
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              color_temp_kelvin: "{{ target_k }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # RIGHT RELEASE - fire event for Hooks compatibility
      # Requires helper to disambiguate from left release (same ZHA code).
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action.split("_")[0] in button_right_release }}'
          - '{{ last_controller_event in button_right_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_right_release

      # ============================================================
      # UP SHORT (with double-press detection) - Turn ON
      # ============================================================
      - conditions: '{{ trigger_action in button_up_short }}'
        sequence:
          - choose:
              # Previous event was an up-short within the double-press window -> double press
              - conditions: '{{ helper_configured and trigger_action == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: '{{ helper_last_controller_event }}'
                      value: '{{ {"a": "double_press_up", "t": as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_up_double
                  - if: '{{ lights_up_double | count > 0 }}'
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ lights_up_double }}"
                        data:
                          color_temp_kelvin: "{{ adaptive_on_kelvin }}"
                          brightness_pct: "{{ turn_on_brightness_pct | int }}"
            # Single press: wait for possible 2nd press if helper is configured.
            # If no helper, fire immediately (double-press cannot trigger anyway).
            default:
              - if: '{{ helper_configured }}'
                then:
                  - delay:
                      milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_up_short
              - if: '{{ lights_up_short | count > 0 }}'
                then:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ lights_up_short }}"
                    data:
                      color_temp_kelvin: "{{ adaptive_on_kelvin }}"
                      brightness_pct: "{{ turn_on_brightness_pct | int }}"

      # ============================================================
      # UP LONG - Brightness increase per iteration (loops 15x)
      # Only acts on dimmable lights that are currently on; caps at 255.
      # ============================================================
      - conditions: '{{ trigger_action in button_up_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_up_long
          - repeat:
              count: '{{ long_press_max_repeats }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_up_long }}'
                    sequence:
                      - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'brightness') is not none }}"
                        then:
                          - variables:
                              current_brightness: "{{ state_attr(repeat.item, 'brightness') | int }}"
                              new_brightness: "{{ [current_brightness + (brightness_step | int), 255] | min }}"
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness: "{{ new_brightness }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # UP RELEASE - fire event for Hooks compatibility
      # Requires helper to disambiguate from down release (overlapping ZHA codes).
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action in button_up_release }}'
          - '{{ last_controller_event in button_up_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_up_release

      # ============================================================
      # DOWN SHORT (with double-press detection) - Turn OFF
      # ============================================================
      - conditions: '{{ trigger_action in button_down_short }}'
        sequence:
          - choose:
              - conditions: '{{ helper_configured and trigger_action == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                sequence:
                  - action: input_text.set_value
                    data:
                      entity_id: '{{ helper_last_controller_event }}'
                      value: '{{ {"a": "double_press_down", "t": as_timestamp(now())} | to_json }}'
                  - event: ahb_controller_event
                    event_data:
                      controller: '{{ controller_id }}'
                      action: button_down_double
                  - if: '{{ lights_down_double | count > 0 }}'
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ lights_down_double }}"
            default:
              - if: '{{ helper_configured }}'
                then:
                  - delay:
                      milliseconds: '{{ adjusted_double_press_delay }}'
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_down_short
              - if: '{{ lights_down_short | count > 0 }}'
                then:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ lights_down_short }}"

      # ============================================================
      # DOWN LONG - Brightness decrease per iteration (loops 15x)
      # Only acts on dimmable lights that are currently on; floors at the
      # configured brightness floor (never turns the light off).
      # ============================================================
      - conditions: '{{ trigger_action in button_down_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_down_long
          - repeat:
              count: '{{ long_press_max_repeats }}'
              sequence:
                - repeat:
                    for_each: '{{ lights_down_long }}'
                    sequence:
                      - if: "{{ states(repeat.item) == 'on' and state_attr(repeat.item, 'brightness') is not none }}"
                        then:
                          - variables:
                              current_brightness: "{{ state_attr(repeat.item, 'brightness') | int }}"
                              new_brightness: "{{ [current_brightness - (brightness_step | int), (brightness_floor | int)] | max }}"
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness: "{{ new_brightness }}"
                - delay:
                    milliseconds: "{{ long_press_loop_delay }}"

      # ============================================================
      # DOWN RELEASE - fire event for Hooks compatibility
      # Requires helper to disambiguate from up release (overlapping ZHA codes).
      # ============================================================
      - conditions:
          - '{{ helper_configured }}'
          - '{{ trigger_action in button_down_release }}'
          - '{{ last_controller_event in button_down_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_down_release
