# Blueprint metadata
blueprint:
  name: Controller - IKEA E2001/E2002 STYRBAR Remote (ZHA, Light Control)
  description: |
    # Controller - IKEA E2001/E2002 STYRBAR Remote (ZHA, Light Control)

    Simplified **ZHA-only** automation for the IKEA E2001/E2002 STYRBAR remote
    with hardcoded light control actions per button. Each button has its own
    light selector, so you can target different lights per button.

    ## Actions
    - **Left short**:  Color temperature down (default -500 K, configurable)
    - **Left long**:   Color temperature down per iteration (default -300 K, configurable; loops, max 15)
    - **Right short**: Color temperature up (default +500 K, configurable)
    - **Right long**:  Color temperature up per iteration (default +300 K, configurable; loops, max 15)
    - **Up short** / **Up double**:     Turn **on** selected lights (sets
      color temperature based on time of day — see *Adaptive turn-on* below)
    - **Up long**:     Brightness up per iteration (default +20, configurable; loops, max 15)
    - **Down short** / **Down double**: Turn **off** selected lights
    - **Down long**:   Brightness down per iteration (default -20, configurable; loops, max 15)

    ## Adaptive turn-on color temperature
    When lights are turned on via **Up short** or **Up double**, their color
    temperature is set based on the time of day:
    - **Daytime** (default 06:00-19:00): **3400 K** (configurable)
    - **Outside daytime**: **2200 K** (configurable)

    Brightness on turn-on is also set to a configurable level (default **100%**).

    The daytime window start/end are selectable in **30-minute intervals** and
    may wrap past midnight. Lights that do not support color temperature are
    still turned on (the color temp value is ignored for them).

    ## Rules
    - Brightness changes only affect lights that are **already on** and
      dimmable. Lights that are off, and non-dimmable lights, are skipped.
    - **Brightness floors at the configured floor (default 1) / caps at 255.**
      Dim-down will never turn a light off — use the Down short/double press
      for that. Bright-up will never exceed maximum.
    - Color temperature changes only affect lights that are **already on**
      and support color temp. Brightness and on/off state are not modified.
    - Kelvin values are clamped to each light's supported min/max range.
    - **Up** and **Down** double-press events are exposed only when the
      optional helper is configured (see below).
    - Long-press loops are capped at **15 iterations** and stop on release.

    ## Optional helper - enables double-press detection
    Double-press detection (Up double / Down double) and release events
    require an `input_text` helper for persistent state across automation
    restarts. **Home Assistant blueprints cannot create config entities
    themselves**, so the helper must be created once manually — but it is
    **optional**:

    - **Helper provided** → full functionality, including Up / Down double
      press and `ahb_controller_event` release events.
    - **Helper left empty** → blueprint still works (short, long, double-
      light selections all function), but double-press and release events
      are disabled. Short presses also fire **immediately** (no wait), which
      makes them feel snappier.

    ### How to create the helper (choose one)

    **Option A — UI (recommended):**
    1. Go to *Settings → Devices & services → Helpers*.
    2. Click *Create helper → Text*.
    3. Name it (e.g. `STYRBAR Last Event`), set **Maximum length: 100**.
    4. Select it in the input below.

    **Option B — YAML:** add to your `configuration.yaml`, then restart HA:
    ```yaml
    input_text:
      styrbar_last_event:
        name: STYRBAR Last Event
        max: 100
    ```

    Based on the Awesome HA Blueprints project by EPMatt.

  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    controller_device:
      name: (Required) Controller Device
      description: The ZHA STYRBAR device to use for this automation.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: Remote Control N2
          multiple: false
    helper_last_controller_event:
      name: (Optional) Helper - Last Controller Event
      description: >-
        An `input_text` helper used to store the last event fired by the controller.
        **Leave empty to skip — double press and release events will be disabled.**
        If set, the helper must already exist (max length ≥ 100). See the
        blueprint description above for instructions on how to create one.
      default: ''
      selector:
        entity:
          domain: input_text

    # ---------- Light selectors per button ----------
    lights_left_short:
      name: Left short press — lights (CT -500 K)
      description: Only lights that are on and support color temp will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_left_long:
      name: Left long press — lights (CT -300 K, looping)
      description: Only lights that are on and support color temp will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_right_short:
      name: Right short press — lights (CT +500 K)
      description: Only lights that are on and support color temp will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_right_long:
      name: Right long press — lights (CT +300 K, looping)
      description: Only lights that are on and support color temp will be affected.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_short:
      name: Up short press — lights (Turn on)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_double:
      name: Up double press — lights (Turn on)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_up_long:
      name: Up long press — lights (Brightness +20, looping)
      description: Only lights that are on and dimmable will be affected. Caps at 255.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_short:
      name: Down short press — lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_double:
      name: Down double press — lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    lights_down_long:
      name: Down long press — lights (Brightness -20, looping)
      description: Only lights that are on and dimmable will be affected. Floors at 1 (never turns off).
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: light

    # ---------- Step sizes ----------
    brightness_step:
      name: (Optional) Brightness step
      description: Amount to change brightness per long-press iteration (0-255 scale).
      default: 20
      selector:
        number:
          min: 1
          max: 64
          mode: box
          step: 1
    brightness_floor:
      name: (Optional) Brightness floor
      description: Minimum brightness for dim-down. The light will never dim below this value (and never turn off via dimming).
      default: 5
      selector:
        number:
          min: 1
          max: 254
          mode: box
          step: 1
    color_temp_step_short:
      name: (Optional) Color temp step - short press
      description: Kelvin change per short press (Left short / Right short).
      default: 500
      selector:
        number:
          min: 50
          max: 2000
          unit_of_measurement: K
          mode: box
          step: 10
    color_temp_step_long:
      name: (Optional) Color temp step - long press iteration
      description: Kelvin change per long-press iteration (Left long / Right long).
      default: 400
      selector:
        number:
          min: 50
          max: 2000
          unit_of_measurement: K
          mode: box
          step: 10
    long_press_max_repeats:
      name: (Optional) Long press - maximum iterations
      description: >-
        How many times a long-press action repeats while the button is held.
        Acts as a safety cap in case the release event is missed. Higher values
        let a single hold travel further (brighter/dimmer or wider color temp range).
      default: 15
      selector:
        number:
          min: 1
          max: 100
          mode: box
          step: 1


    # ---------- Adaptive color temp on turn-on (Up short / Up double) ----------
    day_color_temp:
      name: (Optional) Daytime color temp (on turn-on)
      description: Color temperature applied when a light is turned on during the daytime window.
      default: 3400
      selector:
        number:
          min: 1500
          max: 6500
          unit_of_measurement: K
          mode: box
          step: 10
    night_color_temp:
      name: (Optional) Night-time color temp (on turn-on)
      description: Color temperature applied when a light is turned on outside the daytime window.
      default: 2200
      selector:
        number:
          min: 1500
          max: 6500
          unit_of_measurement: K
          mode: box
          step: 10
    turn_on_brightness_pct:
      name: (Optional) Turn-on brightness
      description: Brightness level applied when lights are turned on (Up short / Up double).
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
          step: 1
    day_start_time:
      name: (Optional) Daytime window - start
      description: Start of the daytime color temp window (30 min intervals). At/after this time the daytime color temp is used.
      default: "06:00"
      selector:
        select:
          mode: dropdown
          options:
            - "00:00"
            - "00:30"
            - "01:00"
