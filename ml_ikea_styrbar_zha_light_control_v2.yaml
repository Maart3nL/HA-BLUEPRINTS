blueprint:
  name: ML Ikea Styrbar zha light control v2.1
  description: "# ML Ikea Styrbar zha light control v2.1\n\nZHA-only IKEA E2001/E2002
    STYRBAR controller with hardcoded light actions.\n**V2.1 changes:** fixed a bug
    where holding Up/Down first executed the\nshort-press action, turning on lights
    that were off (or turning off lights)\nbefore the brightness loop started. Short
    presses on Up/Down now wait for a\nconfigurable hold-detection window before
    executing.\n\n**V2 changes:** per-button light selection for up/down short &
    double,\ncolor-temp buttons act on the up-button lights automatically, and the\ncolor/brightness
    *settings* can be driven by **shared helper entities** so\nseveral STYRBAR automations
    stay in sync — change one helper, every\nautomation updates.\n\n## Actions\n-
    **Left short**:  Color temp down (step from helper, default -500 K)\n- **Left
    long**:   Color temp down per iteration (default -400 K; loops)\n- **Right short**:
    Color temp up (default +500 K)\n- **Right long**:  Color temp up per iteration
    (default +400 K; loops)\n- **Up short**:     Turn on the *up-short* lights (after
    hold-detection window)\n- **Up double**:   Turn on the *up-double* lights\n- **Up
    long**:       Brightness up per iteration (default +20; loops)\n- **Down short**:
    \ Turn off the *down-short* lights (after hold-detection window)\n- **Down double**:
    Turn off the *down-double* lights\n- **Down long**:    Brightness down per iteration
    (default -20; loops)\n\n## Which lights each action uses\n- **Up short / Up double
    / Down short / Down double**: their own selectors.\n- **Color temp (Left & Right,
    short & long)**: the **union of the Up-short\n  and Up-double lights**, deduplicated
    (a light listed in both is handled\n  once). Not separately configurable — it
    always follows the up-button.\n- **Up long (brighten)**: union of Up-short +
    Up-double lights.\n- **Down long (dim)**: union of Down-short + Down-double
    lights.\n\n## Rules\n- Brightness and color-temp adjustments only affect lights
    that are\n  **already on** (and that support the relevant feature). Off lights
    are skipped.\n- Brightness floors at the configured floor (default 5) and caps
    at 255 —\n  dimming never turns a light off.\n- Color temp is clamped to each
    light's supported min/max kelvin.\n- On turn-on (Up short / Up double) lights
    are set to a configurable\n  brightness and a time-of-day color temperature.\n\n##
    Hold-detection window (V2.1)\nThe IKEA remote sends the short-press command
    the moment you touch the\nUp/Down button, and the hold command only ~1 second
    later. To prevent a\nlong press from triggering the short-press action (the
    old bug), single\npresses wait `long_press_detection_ms` before executing.\nIncrease
    this value if a long press still briefly flashes the short-press\naction; decrease
    it to make single presses feel snappier.\n\n## Synced settings via fixed helpers\nThe
    settings below are read **live** at run time from a fixed set of helper\nentities
    (defined in `styrbar_helpers.yaml`). They are **not selectable in\nthis blueprint**
    - every automation built from this blueprint reads the\nsame helpers, so editing
    a helper value (e.g. from a dashboard) instantly\nchanges the behaviour of all
    of them. If a helper is missing or\nunavailable, the built-in fallback is used.\n\n|
    Setting | Helper entity | Fallback |\n|---|---|---|\n| Daytime color temp |
    input_number.styrbar_day_color_temp | 3400 K |\n| Night-time color temp | input_number.styrbar_night_color_temp
    | 2200 K |\n| Daytime window start | input_datetime.styrbar_day_start | 06:00
    |\n| Daytime window end | input_datetime.styrbar_day_end | 19:00 |\n| Color
    temp step - short | input_number.styrbar_color_temp_step_short | 500 K |\n| Color
    temp step - long | input_number.styrbar_color_temp_step_long | 400 K |\n| Brightness
    step | input_number.styrbar_brightness_step | 20 |\n| Brightness floor | input_number.styrbar_brightness_floor
    | 5 |\n\n**You must create these helpers first** (see `styrbar_helpers.yaml`),\notherwise
    the fallback values are always used.\n\n## Optional helper - double press &
    release events\nDouble-press (Up/Down) and `ahb_controller_event` release events
    need an\n`input_text` helper for state across restarts. Leave it empty to disable\nthose
    features; everything else still works.\n"
  domain: automation
  source_url: https://raw.githubusercontent.com/Maart3nL/HA-BLUEPRINTS/refs/heads/main/ml_ikea_styrbar_zha_light_control_v2.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    controller_device:
      name: (Required) Controller Device
      description: The ZHA STYRBAR device to use for this automation.
      selector:
        device:
          filter:
          - integration: zha
            manufacturer: IKEA of Sweden
            model: Remote Control N2
          multiple: false
    helper_last_controller_event:
      name: (Optional) Helper - Last Controller Event
      description: An `input_text` helper used to store the last event fired by the
        controller. **Leave empty to skip — double press and release events will be
        disabled.** If set, the helper must already exist (max length >= 100).
      default: ''
      selector:
        entity:
          domain:
          - input_text
          reorder: false
          multiple: false
    lights_up_short:
      name: Up short press - lights (Turn on)
      description: Turned on at the configured brightness and time-of-day color temp.
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - light
          reorder: false
    lights_up_double:
      name: Up double press - lights (Turn on)
      description: Turned on at the configured brightness and time-of-day color temp.
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - light
          reorder: false
    lights_down_short:
      name: Down short press - lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - light
          reorder: false
    lights_down_double:
      name: Down double press - lights (Turn off)
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - light
          reorder: false
    turn_on_brightness_pct:
      name: (Optional) Turn-on brightness
      description: Brightness level applied when lights are turned on (Up short /
        Up double).
      default: 100
      selector:
        number:
          min: 1.0
          max: 100.0
          unit_of_measurement: '%'
          mode: slider
          step: 1.0
    long_press_max_repeats:
      name: (Optional) Long press - maximum iterations
      description: How many times a long-press action repeats while held (safety cap).
      default: 15
      selector:
        number:
          min: 1.0
          max: 100.0
          mode: box
          step: 1.0
    long_press_loop_delay:
      name: (Optional) Long press loop delay
      description: Delay between iterations during a long press loop.
      default: 150
      selector:
        number:
          min: 50.0
          max: 2000.0
          unit_of_measurement: milliseconds
          mode: box
          step: 10.0
    long_press_detection_ms:
      name: (Optional) Short press - hold detection window
      description: Time a single press on Up/Down waits before executing, so a long
        press does not trigger the short-press action first. Must exceed the remote's
        hold threshold (~1000 ms). Increase if lights flash during a long press;
        decrease for snappier single presses.
      default: 1100
      selector:
        number:
          min: 0.0
          max: 3000.0
          unit_of_measurement: milliseconds
          mode: box
          step: 50.0
    helper_double_press_delay:
      name: (Optional) Helper - Double Press delay
      description: Max delay between the first and second press for the double press
        to register.
      default: 500
      selector:
        number:
          min: 100.0
          max: 5000.0
          unit_of_measurement: milliseconds
          mode: box
          step: 10.0
    helper_debounce_delay:
      name: (Optional) Helper - Debounce delay
      description: Delay used for debouncing raw controller events. Increase if you
        see duplicate events.
      default: 0
      selector:
        number:
          min: 0.0
          max: 1000.0
          unit_of_measurement: milliseconds
          mode: box
          step: 10.0
mode: restart
max_exceeded: silent
triggers:
- trigger: event
  event_type: zha_event
  event_data:
    device_id: !input controller_device
variables:
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  helper_debounce_delay: !input helper_debounce_delay
  long_press_loop_delay: !input long_press_loop_delay
  long_press_max_repeats: !input long_press_max_repeats
  long_press_detection_ms: !input long_press_detection_ms
  turn_on_brightness_pct: !input turn_on_brightness_pct
  controller_id: !input controller_device
  lights_up_short: !input lights_up_short
  lights_up_double: !input lights_up_double
  lights_down_short: !input lights_down_short
  lights_down_double: !input lights_down_double
  e_day_color_temp: input_number.styrbar_day_color_temp
  e_night_color_temp: input_number.styrbar_night_color_temp
  e_day_start_time: input_datetime.styrbar_day_start
  e_day_end_time: input_datetime.styrbar_day_end
  e_color_temp_step_short: input_number.styrbar_color_temp_step_short
  e_color_temp_step_long: input_number.styrbar_color_temp_step_long
  e_brightness_step: input_number.styrbar_brightness_step
  e_brightness_floor: input_number.styrbar_brightness_floor
  day_color_temp: '{{ (states(e_day_color_temp) | float(3400)) | int }}'
  night_color_temp: '{{ (states(e_night_color_temp) | float(2200)) | int }}'
  color_temp_step_short: '{{ (states(e_color_temp_step_short) | float(500)) | int }}'
  color_temp_step_long: '{{ (states(e_color_temp_step_long) | float(400)) | int }}'
  brightness_step: '{{ (states(e_brightness_step) | float(20)) | int }}'
  brightness_floor: '{{ (states(e_brightness_floor) | float(5)) | int }}'
  day_start_time: '{{ states(e_day_start_time) if states(e_day_start_time) not in
    [''unknown'', ''unavailable''] else ''06:00'' }}'
  day_end_time: '{{ states(e_day_end_time) if states(e_day_end_time) not in [''unknown'',
    ''unavailable''] else ''19:00'' }}'
  ct_lights: '{{ (lights_up_short + lights_up_double) | unique | list }}'
  up_long_lights: '{{ (lights_up_short + lights_up_double) | unique | list }}'
  down_long_lights: '{{ (lights_down_short + lights_down_double) | unique | list }}'
  adjusted_double_press_delay: '{{ [helper_double_press_delay - helper_debounce_delay,
    100] | max }}'
  helper_configured: '{{ (helper_last_controller_event | default('''') | string |
    trim) != '''' }}'
  single_press_delay_ms: '{{ [long_press_detection_ms | int, adjusted_double_press_delay
    | int if helper_configured else 0] | max }}'
  adaptive_on_kelvin: '{%- set cur = now().hour * 60 + now().minute -%} {%- set start
    = day_start_time.split('':'')[0] | int * 60 + day_start_time.split('':'')[1] |
    int -%} {%- set end = day_end_time.split('':'')[0] | int * 60 + day_end_time.split('':'')[1]
    | int -%} {%- set is_day = (start <= cur < end) if start <= end else (cur >= start
    or cur < end) -%} {{ day_color_temp if is_day else night_color_temp }}'
  button_left_short:
  - press_257_13_0
  button_left_long:
  - hold_3329_0
  button_left_release:
  - release
  button_right_short:
  - press_256_13_0
  button_right_long:
  - hold_3328_0
  button_right_release:
  - release
  button_up_short:
  - 'on'
  button_up_long:
  - move_with_on_off_0_83
  - move_with_on_off_MoveMode.Up_83
  button_up_release:
  - stop
  - stop_with_on_off
  button_down_short:
  - 'off'
  button_down_long:
  - move_1_83
  - move_MoveMode.Down_83_0_0
  button_down_release:
  - stop
  - stop_with_on_off
  - stop_0_0
  trigger_action: '{{ trigger.event.data.command }}{{ "_" if trigger.event.data.args|length
    > 0 }}{{ trigger.event.data.args|join("_") }}'
  needs_helper_write: "{{ trigger_action in button_left_short\n   or trigger_action
    in button_right_short\n   or trigger_action in button_up_short\n   or trigger_action
    in button_down_short\n   or trigger_action in button_left_long\n   or trigger_action
    in button_right_long\n   or trigger_action in button_up_long\n   or trigger_action
    in button_down_long }}"
conditions:
- condition: template
  value_template: '{{ trigger_action not in ["", "None", "unknown"] }}'
actions:
- delay:
    milliseconds: !input helper_debounce_delay
- variables:
    deserialized_state: '{{ states(helper_last_controller_event) | from_json(default={})
      if helper_configured else {} }}'
    trigger_delta: '{{ (as_timestamp(now()) - (deserialized_state.t | default(0)))
      * 1000 }}'
    last_controller_event: '{{ deserialized_state.a | default("") }}'
- if: '{{ helper_configured and needs_helper_write }}'
  then:
  - action: input_text.set_value
    data:
      entity_id: '{{ helper_last_controller_event }}'
      value: '{{ {"a": trigger_action, "t": as_timestamp(now())} | to_json }}'
- choose:
  - conditions: '{{ trigger_action in button_left_short }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_left_short
    - repeat:
        for_each: '{{ ct_lights }}'
        sequence:
        - if: '{{ states(repeat.item) == ''on'' and state_attr(repeat.item, ''color_temp_kelvin'')
            is not none }}'
          then:
          - variables:
              current_k: '{{ state_attr(repeat.item, ''color_temp_kelvin'') | int
                }}'
              min_k: '{{ state_attr(repeat.item, ''min_color_temp_kelvin'') | int(default=2000)
                }}'
              max_k: '{{ state_attr(repeat.item, ''max_color_temp_kelvin'') | int(default=6500)
                }}'
              target_k: '{{ [[current_k - (color_temp_step_short | int), min_k] |
                max, max_k] | min }}'
          - action: light.turn_on
            target:
              entity_id: '{{ repeat.item }}'
            data:
              color_temp_kelvin: '{{ target_k }}'
  - conditions: '{{ trigger_action in button_left_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_left_long
    - repeat:
        count: '{{ long_press_max_repeats }}'
        sequence:
        - repeat:
            for_each: '{{ ct_lights }}'
            sequence:
            - if: '{{ states(repeat.item) == ''on'' and state_attr(repeat.item, ''color_temp_kelvin'')
                is not none }}'
              then:
              - variables:
                  current_k: '{{ state_attr(repeat.item, ''color_temp_kelvin'') |
                    int }}'
                  min_k: '{{ state_attr(repeat.item, ''min_color_temp_kelvin'') |
                    int(default=2000) }}'
                  max_k: '{{ state_attr(repeat.item, ''max_color_temp_kelvin'') |
                    int(default=6500) }}'
                  target_k: '{{ [[current_k - (color_temp_step_long | int), min_k]
                | max, max_k] | min }}'
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  color_temp_kelvin: '{{ target_k }}'
        - delay:
            milliseconds: '{{ long_press_loop_delay }}'
  - conditions:
    - '{{ helper_configured }}'
    - '{{ trigger_action.split("_")[0] in button_left_release }}'
    - '{{ last_controller_event in button_left_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_left_release
  - conditions: '{{ trigger_action in button_right_short }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_right_short
    - repeat:
        for_each: '{{ ct_lights }}'
        sequence:
        - if: '{{ states(repeat.item) == ''on'' and state_attr(repeat.item, ''color_temp_kelvin'')
            is not none }}'
          then:
          - variables:
              current_k: '{{ state_attr(repeat.item, ''color_temp_kelvin'') | int
                }}'
              min_k: '{{ state_attr(repeat.item, ''min_color_temp_kelvin'') | int(default=2000)
                }}'
              max_k: '{{ state_attr(repeat.item, ''max_color_temp_kelvin'') | int(default=6500)
                }}'
              target_k: '{{ [[current_k + (color_temp_step_short | int), min_k] |
                max, max_k] | min }}'
          - action: light.turn_on
            target:
              entity_id: '{{ repeat.item }}'
            data:
              color_temp_kelvin: '{{ target_k }}'
  - conditions: '{{ trigger_action in button_right_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_right_long
    - repeat:
        count: '{{ long_press_max_repeats }}'
        sequence:
        - repeat:
            for_each: '{{ ct_lights }}'
            sequence:
            - if: '{{ states(repeat.item) == ''on'' and state_attr(repeat.item, ''color_temp_kelvin'')
                is not none }}'
              then:
              - variables:
                  current_k: '{{ state_attr(repeat.item, ''color_temp_kelvin'') |
                    int }}'
                  min_k: '{{ state_attr(repeat.item, ''min_color_temp_kelvin'') |
                    int(default=2000) }}'
                  max_k: '{{ state_attr(repeat.item, ''max_color_temp_kelvin'') |
                    int(default=6500) }}'
                  target_k: '{{ [[current_k + (color_temp_step_long | int), min_k]
                | max, max_k] | min }}'
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  color_temp_kelvin: '{{ target_k }}'
        - delay:
            milliseconds: '{{ long_press_loop_delay }}'
  - conditions:
    - '{{ helper_configured }}'
    - '{{ trigger_action.split("_")[0] in button_right_release }}'
    - '{{ last_controller_event in button_right_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_right_release
  - conditions: '{{ trigger_action in button_up_short }}'
    sequence:
    - choose:
      - conditions: '{{ helper_configured and trigger_action == last_controller_event
          and trigger_delta | int <= helper_double_press_delay | int }}'
        sequence:
        - action: input_text.set_value
          data:
            entity_id: '{{ helper_last_controller_event }}'
            value: '{{ {"a": "double_press_up", "t": as_timestamp(now())} | to_json
              }}'
        - event: ahb_controller_event
          event_data:
            controller: '{{ controller_id }}'
            action: button_up_double
        - if: '{{ lights_up_double | count > 0 }}'
          then:
          - action: light.turn_on
            target:
              entity_id: '{{ lights_up_double }}'
            data:
              color_temp_kelvin: '{{ adaptive_on_kelvin }}'
              brightness_pct: '{{ turn_on_brightness_pct | int }}'
      default:
      - delay:
          milliseconds: '{{ single_press_delay_ms | int }}'
      - event: ahb_controller_event
        event_data:
          controller: '{{ controller_id }}'
          action: button_up_short
      - if: '{{ lights_up_short | count > 0 }}'
        then:
        - action: light.turn_on
          target:
            entity_id: '{{ lights_up_short }}'
          data:
            color_temp_kelvin: '{{ adaptive_on_kelvin }}'
            brightness_pct: '{{ turn_on_brightness_pct | int }}'
  - conditions: '{{ trigger_action in button_up_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_up_long
    - repeat:
        count: '{{ long_press_max_repeats }}'
        sequence:
        - repeat:
            for_each: '{{ up_long_lights }}'
            sequence:
            - if: '{{ states(repeat.item) == ''on'' and state_attr(repeat.item, ''brightness'')
                is not none }}'
              then:
              - variables:
                  current_brightness: '{{ state_attr(repeat.item, ''brightness'')
                    | int }}'
                  new_brightness: '{{ [current_brightness + (brightness_step | int),
                    255] | min }}'
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  brightness: '{{ new_brightness }}'
        - delay:
            milliseconds: '{{ long_press_loop_delay }}'
  - conditions:
    - '{{ helper_configured }}'
    - '{{ trigger_action in button_up_release }}'
    - '{{ last_controller_event in button_up_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_up_release
  - conditions: '{{ trigger_action in button_down_short }}'
    sequence:
    - choose:
      - conditions: '{{ helper_configured and trigger_action == last_controller_event
          and trigger_delta | int <= helper_double_press_delay | int }}'
        sequence:
        - action: input_text.set_value
          data:
            entity_id: '{{ helper_last_controller_event }}'
            value: '{{ {"a": "double_press_down", "t": as_timestamp(now())} | to_json
              }}'
        - event: ahb_controller_event
          event_data:
            controller: '{{ controller_id }}'
            action: button_down_double
        - if: '{{ lights_down_double | count > 0 }}'
          then:
          - action: light.turn_off
            target:
              entity_id: '{{ lights_down_double }}'
      default:
      - delay:
          milliseconds: '{{ single_press_delay_ms | int }}'
      - event: ahb_controller_event
        event_data:
          controller: '{{ controller_id }}'
          action: button_down_short
      - if: '{{ lights_down_short | count > 0 }}'
        then:
        - action: light.turn_off
            target:
              entity_id: '{{ lights_down_short }}'
  - conditions: '{{ trigger_action in button_down_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_down_long
    - repeat:
        count: '{{ long_press_max_repeats }}'
        sequence:
        - repeat:
            for_each: '{{ down_long_lights }}'
            sequence:
            - if: '{{ states(repeat.item) == ''on'' and state_attr(repeat.item, ''brightness'')
                is not none }}'
              then:
              - variables:
                  current_brightness: '{{ state_attr(repeat.item, ''brightness'')
                    | int }}'
                  new_brightness: '{{ [current_brightness - (brightness_step | int),
                    (brightness_floor | int)] | max }}'
              - action: light.turn_on
                target:
                  entity_id: '{{ repeat.item }}'
                data:
                  brightness: '{{ new_brightness }}'
        - delay:
            milliseconds: '{{ long_press_loop_delay }}'
  - conditions:
    - '{{ helper_configured }}'
    - '{{ trigger_action in button_down_release }}'
    - '{{ last_controller_event in button_down_long }}'
    sequence:
    - event: ahb_controller_event
      event_data:
        controller: '{{ controller_id }}'
        action: button_down_release
